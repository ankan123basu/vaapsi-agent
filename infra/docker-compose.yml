# ============================================
# Recoup — Docker Compose
# ============================================
# One-command spin-up: docker-compose up
# ============================================

version: "3.9"

services:
  agent-service:
    build:
      context: ../apps/agent-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../apps/agent-service:/app
      - agent-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - agent-service
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped

volumes:
  agent-data:
